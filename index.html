<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>英語勇者團 — 主選單</title>
  <style>
    :root {
      --bg: #0d0d1a;
      --card: #1e1e35;
      --gold: #d4a843;
      --gold-l: #f0c96a;
      --border: #2e2e50;
      --text: #e8dfc8;
      --muted: #7a7a9a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      background-image: radial-gradient(ellipse at 20% 30%, #1a0a3a55 0%, transparent 60%),
                        radial-gradient(ellipse at 80% 70%, #3a0a0a55 0%, transparent 60%);
    }

    .hero {
      text-align: center;
      margin-bottom: 52px;
    }

    .hero-emoji {
      font-size: 5rem;
      display: block;
      margin-bottom: 20px;
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(-12px); }
    }

    .hero h1 {
      font-size: 2.8rem;
      font-weight: 900;
      color: var(--gold);
      text-shadow: 0 0 40px rgba(212,168,67,.4);
      letter-spacing: .04em;
      margin-bottom: 10px;
    }

    .hero p {
      font-size: 1rem;
      color: var(--muted);
      line-height: 1.6;
    }

    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
      width: 100%;
      max-width: 760px;
    }

    .game-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px 24px;
      text-decoration: none;
      color: inherit;
      transition: transform .2s, border-color .2s, box-shadow .2s;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .game-card:hover {
      transform: translateY(-4px);
      border-color: var(--gold);
      box-shadow: 0 8px 30px rgba(212,168,67,.15);
    }

    .card-emoji { font-size: 2.8rem; }

    .card-tag {
      display: inline-block;
      font-size: .65rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .15em;
      padding: 3px 10px;
      border-radius: 20px;
      background: rgba(212,168,67,.15);
      color: var(--gold);
      width: fit-content;
    }

    .card-title {
      font-size: 1.2rem;
      font-weight: 700;
      color: #fff;
    }

    .card-desc {
      font-size: .85rem;
      color: var(--muted);
      line-height: 1.6;
      flex: 1;
    }

    .card-arrow {
      font-size: .85rem;
      color: var(--gold);
      font-weight: 600;
      margin-top: 4px;
    }

    .coming-soon {
      opacity: .45;
      cursor: not-allowed;
      pointer-events: none;
    }

    .coming-soon .card-tag {
      background: rgba(122,122,154,.15);
      color: var(--muted);
    }

    footer {
      margin-top: 52px;
      font-size: .78rem;
      color: var(--muted);
      text-align: center;
      line-height: 1.8;
    }
  </style>
</head>
<body>

  <div class="hero">
    <span class="hero-emoji">⚔️</span>
    <h1>英語勇者團</h1>
    <p>English Quest Adventure<br>選擇你的冒險，開口說英語！</p>
  </div>

  <div class="card-grid">

    <a class="game-card" href="DND_v1.html">
      <span class="card-emoji">🐉</span>
      <span class="card-tag">v1.0 — 已上線</span>
      <div class="card-title">地下城闖關</div>
      <div class="card-desc">
        帶領勇者隊伍穿越洞穴、挑戰獅身人面獸、征服巨龍！<br>
        包含場景切換、遭遇事件、職業技能發動。
      </div>
      <div class="card-arrow">開始遊戲 →</div>
    </a>

    <div class="game-card coming-soon">
      <span class="card-emoji">🏰</span>
      <span class="card-tag">即將推出</span>
      <div class="card-title">城堡保衛戰</div>
      <div class="card-desc">
        守衛王國的語言之城！用英語下達命令、指揮士兵，抵禦魔王軍的進攻。
      </div>
      <div class="card-arrow">敬請期待</div>
    </div>

    <div class="game-card coming-soon">
      <span class="card-emoji">🌊</span>
      <span class="card-tag">即將推出</span>
      <div class="card-title">深海迷航</div>
      <div class="card-desc">
        潛入英語的深海世界！與神秘海洋生物對話，解開古老語言謎題。
      </div>
      <div class="card-arrow">敬請期待</div>
    </div>

  </div>

  <footer>
    英語勇者團 © 2026 &nbsp;·&nbsp; 讓開口說英語變得有趣
  </footer>

</body>
</html>
