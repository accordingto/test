<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YouTube 人聲移除工具</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f0f1a;
      font-family: 'Segoe UI', system-ui, sans-serif;
      color: #e0e0f0;
    }

    .card {
      background: #1a1a2e;
      border: 1px solid #2a2a4a;
      border-radius: 20px;
      padding: 48px 40px;
      width: 100%;
      max-width: 560px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 8px;
    }

    .logo svg {
      width: 40px;
      height: 40px;
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 700;
      background: linear-gradient(135deg, #a78bfa, #60a5fa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      color: #7070a0;
      font-size: 0.9rem;
      margin-bottom: 36px;
      margin-top: 4px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      color: #a0a0c0;
      margin-bottom: 8px;
      font-weight: 500;
    }

    .input-row {
      display: flex;
      gap: 10px;
      margin-bottom: 24px;
    }

    input[type="text"] {
      flex: 1;
      background: #0f0f1a;
      border: 1px solid #2a2a4a;
      border-radius: 10px;
      padding: 12px 16px;
      color: #e0e0f0;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus {
      border-color: #7c3aed;
    }

    input[type="text"]::placeholder {
      color: #404060;
    }

    button {
      background: linear-gradient(135deg, #7c3aed, #2563eb);
      border: none;
      border-radius: 10px;
      padding: 12px 22px;
      color: #fff;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
      white-space: nowrap;
    }

    button:hover { opacity: 0.9; }
    button:active { transform: scale(0.97); }
    button:disabled { opacity: 0.4; cursor: not-allowed; }

    /* Status area */
    #status-box {
      display: none;
      background: #0f0f1a;
      border: 1px solid #2a2a4a;
      border-radius: 12px;
      padding: 20px;
    }

    .status-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .spinner {
      width: 22px;
      height: 22px;
      border: 3px solid #2a2a4a;
      border-top-color: #7c3aed;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      flex-shrink: 0;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .status-text {
      font-size: 0.9rem;
      color: #a0a0c0;
    }

    .status-title {
      font-size: 0.85rem;
      color: #6060a0;
      margin-top: 6px;
      padding-left: 34px;
    }

    /* Steps */
    .steps {
      margin-top: 16px;
      padding-left: 34px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .step {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.83rem;
      color: #404060;
      transition: color 0.3s;
    }

    .step.active { color: #a78bfa; }
    .step.done { color: #34d399; }

    .step-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: currentColor;
      flex-shrink: 0;
    }

    /* Error */
    .error-box {
      background: #2a0f0f;
      border: 1px solid #5a1a1a;
      border-radius: 10px;
      padding: 14px 16px;
      color: #f87171;
      font-size: 0.875rem;
      margin-top: 12px;
      display: none;
    }

    /* Download button */
    #download-btn {
      display: none;
      width: 100%;
      margin-top: 16px;
      padding: 14px;
      background: linear-gradient(135deg, #059669, #0284c7);
      border-radius: 10px;
      font-size: 1rem;
    }

    .done-icon {
      display: none;
      font-size: 1.5rem;
      margin-right: 6px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="20" cy="20" r="20" fill="url(#g)"/>
        <path d="M14 12 L30 20 L14 28 Z" fill="white"/>
        <defs>
          <linearGradient id="g" x1="0" y1="0" x2="40" y2="40">
            <stop offset="0%" stop-color="#7c3aed"/>
            <stop offset="100%" stop-color="#2563eb"/>
          </linearGradient>
        </defs>
      </svg>
      <h1>人聲移除工具</h1>
    </div>
    <p class="subtitle">輸入 YouTube 連結，自動提取音樂並移除人聲</p>

    <label for="url-input">YouTube 連結</label>
    <div class="input-row">
      <input
        type="text"
        id="url-input"
        placeholder="https://www.youtube.com/watch?v=..."
      />
      <button id="submit-btn" onclick="submitJob()">開始處理</button>
    </div>

    <div id="status-box">
      <div class="status-row">
        <div class="spinner" id="spinner"></div>
        <div>
          <div class="status-text" id="status-text">準備中...</div>
          <div class="status-title" id="video-title"></div>
        </div>
      </div>

      <div class="steps">
        <div class="step" id="step-download">
          <div class="step-dot"></div>下載 YouTube 音訊
        </div>
        <div class="step" id="step-separate">
          <div class="step-dot"></div>AI 人聲分離中（可能需要 1-3 分鐘）
        </div>
        <div class="step" id="step-done">
          <div class="step-dot"></div>完成，準備下載
        </div>
      </div>

      <div class="error-box" id="error-box"></div>
      <button id="download-btn" onclick="downloadResult()">⬇ 下載純音樂（無人聲）</button>
    </div>
  </div>

  <script>
    let currentJobId = null;
    let pollTimer = null;

    const STEP_MAP = {
      queued: { text: "排隊中...", step: null },
      downloading: { text: "正在下載 YouTube 音訊...", step: "step-download" },
      separating: { text: "AI 人聲分離中...", step: "step-separate" },
      done: { text: "處理完成！", step: "step-done" },
      error: { text: "發生錯誤", step: null },
    };

    async function submitJob() {
      const url = document.getElementById("url-input").value.trim();
      if (!url) { alert("請輸入 YouTube 連結"); return; }

      document.getElementById("submit-btn").disabled = true;
      document.getElementById("status-box").style.display = "block";
      document.getElementById("download-btn").style.display = "none";
      document.getElementById("error-box").style.display = "none";
      document.getElementById("video-title").textContent = "";
      ["step-download", "step-separate", "step-done"].forEach(id => {
        document.getElementById(id).className = "step";
      });
      document.getElementById("spinner").style.display = "block";

      try {
        const res = await fetch("/api/submit", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ url }),
        });
        const data = await res.json();
        if (data.error) throw new Error(data.error);
        currentJobId = data.job_id;
        pollStatus();
      } catch (e) {
        showError(e.message);
      }
    }

    function pollStatus() {
      if (pollTimer) clearTimeout(pollTimer);
      pollTimer = setTimeout(async () => {
        if (!currentJobId) return;
        try {
          const res = await fetch(`/api/status/${currentJobId}`);
          const data = await res.json();
          updateUI(data);
          if (data.status !== "done" && data.status !== "error") {
            pollStatus();
          }
        } catch (e) {
          showError("無法連線到伺服器");
        }
      }, 2000);
    }

    function updateUI(data) {
      const { status, title, error } = data;
      const map = STEP_MAP[status] || { text: status, step: null };

      document.getElementById("status-text").textContent = map.text;
      if (title) document.getElementById("video-title").textContent = `🎵 ${title}`;

      const steps = ["step-download", "step-separate", "step-done"];
      const activeIdx = map.step ? steps.indexOf(map.step) : -1;
      steps.forEach((id, i) => {
        const el = document.getElementById(id);
        if (i < activeIdx) el.className = "step done";
        else if (i === activeIdx) el.className = "step active";
        else el.className = "step";
      });

      if (status === "done") {
        document.getElementById("spinner").style.display = "none";
        document.getElementById("download-btn").style.display = "block";
        steps.forEach(id => document.getElementById(id).className = "step done");
        document.getElementById("submit-btn").disabled = false;
      }

      if (status === "error") {
        showError(error || "未知錯誤");
      }
    }

    function showError(msg) {
      const box = document.getElementById("error-box");
      box.textContent = "❌ " + msg;
      box.style.display = "block";
      document.getElementById("spinner").style.display = "none";
      document.getElementById("submit-btn").disabled = false;
    }

    function downloadResult() {
      if (currentJobId) {
        window.location.href = `/api/download/${currentJobId}`;
      }
    }

    document.getElementById("url-input").addEventListener("keydown", e => {
      if (e.key === "Enter") submitJob();
    });
  </script>
</body>
</html>
