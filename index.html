<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>計算機</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #1a1a2e;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .calculator {
      background: #16213e;
      border-radius: 24px;
      padding: 24px;
      width: 320px;
      box-shadow: 0 20px 60px rgba(0,0,0,.5), 0 0 0 1px rgba(255,255,255,.06);
    }

    .display {
      background: #0f3460;
      border-radius: 14px;
      padding: 20px 20px 14px;
      margin-bottom: 20px;
      min-height: 100px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: flex-end;
      overflow: hidden;
    }

    .display .expr {
      font-size: 0.85rem;
      color: #7a8cb5;
      min-height: 1.2em;
      word-break: break-all;
      text-align: right;
    }

    .display .result {
      font-size: 2.6rem;
      font-weight: 300;
      color: #e2e8f0;
      word-break: break-all;
      text-align: right;
      line-height: 1.2;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    button {
      border: none;
      border-radius: 12px;
      font-size: 1.1rem;
      font-weight: 500;
      height: 62px;
      cursor: pointer;
      transition: transform .08s, filter .08s;
      user-select: none;
    }

    button:active {
      transform: scale(.93);
      filter: brightness(.85);
    }

    .btn-num {
      background: #1e3a5f;
      color: #e2e8f0;
    }

    .btn-op {
      background: #0f4c8a;
      color: #93c5fd;
    }

    .btn-eq {
      background: #2563eb;
      color: #fff;
      font-size: 1.4rem;
    }

    .btn-clear {
      background: #7f1d1d;
      color: #fca5a5;
    }

    .btn-func {
      background: #1e3a5f;
      color: #94a3b8;
      font-size: 0.95rem;
    }

    .span2 { grid-column: span 2; }
  </style>
</head>
<body>

<div class="calculator">
  <div class="display">
    <div class="expr" id="expr"></div>
    <div class="result" id="result">0</div>
  </div>

  <div class="buttons">
    <button class="btn-clear" onclick="clearAll()">AC</button>
    <button class="btn-func"  onclick="toggleSign()">+/−</button>
    <button class="btn-func"  onclick="percent()">%</button>
    <button class="btn-op"    onclick="inputOp('/')">÷</button>

    <button class="btn-num" onclick="inputNum('7')">7</button>
    <button class="btn-num" onclick="inputNum('8')">8</button>
    <button class="btn-num" onclick="inputNum('9')">9</button>
    <button class="btn-op"  onclick="inputOp('*')">×</button>

    <button class="btn-num" onclick="inputNum('4')">4</button>
    <button class="btn-num" onclick="inputNum('5')">5</button>
    <button class="btn-num" onclick="inputNum('6')">6</button>
    <button class="btn-op"  onclick="inputOp('-')">−</button>

    <button class="btn-num" onclick="inputNum('1')">1</button>
    <button class="btn-num" onclick="inputNum('2')">2</button>
    <button class="btn-num" onclick="inputNum('3')">3</button>
    <button class="btn-op"  onclick="inputOp('+')">+</button>

    <button class="btn-num span2" onclick="inputNum('0')">0</button>
    <button class="btn-num" onclick="inputDot()">.</button>
    <button class="btn-eq"  onclick="calculate()">=</button>
  </div>
</div>

<script>
  let current = '0';
  let prev = '';
  let operator = '';
  let justCalc = false;

  const resultEl = document.getElementById('result');
  const exprEl   = document.getElementById('expr');

  const opSymbol = { '+': '+', '-': '−', '*': '×', '/': '÷' };

  function updateDisplay() {
    resultEl.textContent = formatNum(current);
  }

  function formatNum(n) {
    if (n === 'Error') return 'Error';
    const num = parseFloat(n);
    if (isNaN(num)) return n;
    if (Math.abs(num) >= 1e13 || (Math.abs(num) < 1e-6 && num !== 0)) {
      return num.toExponential(6).replace(/\.?0+e/, 'e');
    }
    const parts = n.split('.');
    parts[0] = parseInt(parts[0], 10).toLocaleString('zh-TW');
    return parts.join('.');
  }

  function inputNum(n) {
    if (justCalc) { current = n; justCalc = false; }
    else if (current === '0') current = n;
    else if (current.length < 15) current += n;
    updateDisplay();
  }

  function inputDot() {
    if (justCalc) { current = '0.'; justCalc = false; }
    else if (!current.includes('.')) current += '.';
    updateDisplay();
  }

  function inputOp(op) {
    justCalc = false;
    if (operator && !justCalc) {
      const r = compute(parseFloat(prev), parseFloat(current), operator);
      current = String(r);
      prev = current;
    } else {
      prev = current;
    }
    operator = op;
    exprEl.textContent = formatNum(prev) + ' ' + opSymbol[op];
    justCalc = false;
    current = '0';
    updateDisplay();
  }

  function compute(a, b, op) {
    switch (op) {
      case '+': return round(a + b);
      case '-': return round(a - b);
      case '*': return round(a * b);
      case '/': return b === 0 ? 'Error' : round(a / b);
    }
  }

  function round(n) {
    return parseFloat(n.toPrecision(13));
  }

  function calculate() {
    if (!operator) return;
    const a = parseFloat(prev);
    const b = parseFloat(current);
    exprEl.textContent = formatNum(prev) + ' ' + opSymbol[operator] + ' ' + formatNum(current) + ' =';
    const r = compute(a, b, operator);
    current = String(r);
    operator = '';
    prev = '';
    justCalc = true;
    updateDisplay();
  }

  function clearAll() {
    current = '0'; prev = ''; operator = ''; justCalc = false;
    exprEl.textContent = '';
    updateDisplay();
  }

  function toggleSign() {
    if (current === '0' || current === 'Error') return;
    current = current.startsWith('-') ? current.slice(1) : '-' + current;
    updateDisplay();
  }

  function percent() {
    const n = parseFloat(current);
    current = String(round(n / 100));
    updateDisplay();
  }

  document.addEventListener('keydown', e => {
    if (e.key >= '0' && e.key <= '9') inputNum(e.key);
    else if (e.key === '.') inputDot();
    else if (e.key === '+') inputOp('+');
    else if (e.key === '-') inputOp('-');
    else if (e.key === '*') inputOp('*');
    else if (e.key === '/') { e.preventDefault(); inputOp('/'); }
    else if (e.key === 'Enter' || e.key === '=') calculate();
    else if (e.key === 'Escape') clearAll();
    else if (e.key === 'Backspace') {
      if (current.length > 1) current = current.slice(0, -1);
      else current = '0';
      updateDisplay();
    }
  });
</script>

</body>
</html>
