<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>英語勇者團 ⚔️</title>
  <style>
    :root {
      --bg: #0d0d1a;
      --surface: #16162a;
      --card: #1e1e35;
      --gold: #d4a843;
      --gold-l: #f0c96a;
      --red: #e74c3c;
      --green: #27ae60;
      --blue: #3d5fe0;
      --text: #e8dfc8;
      --muted: #7a7a9a;
      --border: #2e2e50;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── SETUP ── */
    #setup-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 40px 20px;
      background: radial-gradient(ellipse at center, #1a0a3a 0%, #0d0d1a 70%);
    }
    .setup-title {
      font-size: 2.8rem;
      color: var(--gold);
      text-shadow: 0 0 30px rgba(212,168,67,.5);
      margin-bottom: 6px;
      text-align: center;
    }
    .setup-sub { color: var(--muted); margin-bottom: 36px; text-align: center; }
    .setup-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px;
      width: 100%;
      max-width: 460px;
    }
    .setup-card h2 {
      color: var(--gold);
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: .12em;
      margin-bottom: 14px;
    }
    .player-row { display: flex; gap: 8px; margin-bottom: 10px; align-items: center; }
    .player-icon { font-size: 1.3rem; width: 32px; text-align: center; }
    .player-row input {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 9px 12px;
      color: var(--text);
      font-size: .9rem;
      outline: none;
      transition: border-color .2s;
    }
    .player-row input:focus { border-color: var(--gold); }
    .player-row input::placeholder { color: var(--muted); }
    .btn-rm {
      width: 28px; height: 28px; border-radius: 50%;
      border: none; background: var(--border); color: var(--muted);
      cursor: pointer; font-size: .85rem;
    }
    .btn-rm:hover { background: var(--red); color: #fff; }
    .btn-add-player {
      width: 100%; padding: 8px; margin-top: 6px;
      background: transparent; border: 1px dashed var(--border);
      border-radius: 8px; color: var(--muted); cursor: pointer; font-size: .85rem;
    }
    .btn-add-player:hover { border-color: var(--gold); color: var(--gold); }
    .divider { height: 1px; background: var(--border); margin: 20px 0; }
    .diff-row { display: flex; gap: 8px; margin-bottom: 22px; }
    .diff-btn {
      flex: 1; padding: 10px 6px;
      border: 2px solid var(--border); border-radius: 8px;
      background: transparent; color: var(--muted);
      cursor: pointer; font-size: .8rem; line-height: 1.4;
      transition: all .2s;
    }
    .diff-btn.active { border-color: var(--gold); color: var(--gold); background: rgba(212,168,67,.1); }
    .btn-start {
      width: 100%; padding: 15px;
      background: linear-gradient(135deg, var(--gold), #c8962a);
      color: #000; border: none; border-radius: 10px;
      font-size: 1.05rem; font-weight: 700; cursor: pointer;
      transition: opacity .2s, transform .1s; letter-spacing: .05em;
    }
    .btn-start:hover { opacity: .9; }
    .btn-start:active { transform: scale(.98); }

    /* ── GAME ── */
    #game-screen { display: none; flex-direction: column; min-height: 100vh; }

    #hp-bar {
      display: flex; justify-content: center; flex-wrap: wrap;
      gap: 14px; padding: 12px 20px;
      background: var(--surface); border-bottom: 1px solid var(--border);
    }
    .p-hp { display: flex; flex-direction: column; align-items: center; gap: 3px; }
    .p-hp-name { font-size: .7rem; color: var(--muted); max-width: 80px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .p-hp-hearts { display: flex; gap: 2px; font-size: 1rem; }

    .scene-dots {
      display: flex; justify-content: center; gap: 6px; padding: 8px 0;
      background: var(--surface);
    }
    .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--border); transition: all .3s;
    }
    .dot.active { background: var(--gold); width: 20px; border-radius: 4px; }
    .dot.done { background: var(--muted); }

    #scene-area {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 28px 20px 20px; transition: background .8s ease;
      min-height: 400px;
    }
    .s-emoji {
      font-size: 5rem; margin-bottom: 14px;
      filter: drop-shadow(0 0 20px rgba(255,255,255,.25));
      animation: float 3s ease-in-out infinite;
    }
    @keyframes float {
      0%,100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    .s-phase { font-size: .7rem; text-transform: uppercase; letter-spacing: .2em; color: var(--gold); margin-bottom: 6px; }
    .s-title { font-size: 2rem; font-weight: 700; color: #fff; text-align: center; margin-bottom: 4px; }
    .s-subtitle { font-size: .95rem; color: var(--muted); font-style: italic; margin-bottom: 24px; text-align: center; }
    .challenge-box {
      background: rgba(212,168,67,.08);
      border: 2px solid var(--gold);
      border-radius: 12px; padding: 20px 24px;
      max-width: 580px; width: 100%; text-align: center;
    }
    .challenge-label { font-size: .65rem; text-transform: uppercase; letter-spacing: .15em; color: var(--gold); margin-bottom: 8px; }
    .challenge-text { font-size: 1.1rem; color: #fff; line-height: 1.65; font-weight: 500; }
    .challenge-format { font-size: .85rem; color: var(--muted); margin-top: 10px; font-style: italic; }

    #dice-display { margin-top: 20px; text-align: center; display: none; animation: popIn .3s ease; }
    @keyframes popIn { from { transform: scale(.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    .dice-lbl { font-size: .75rem; color: var(--muted); }
    .dice-val { font-size: 3.5rem; }
    .dice-verdict { font-size: 1rem; font-weight: 700; margin-top: 2px; }
    .ok { color: var(--green); } .ng { color: var(--red); }

    /* ── HOST PANEL ── */
    #host-panel { background: var(--surface); border-top: 2px solid var(--gold); }
    #host-toggle {
      width: 100%; padding: 10px 20px;
      background: transparent; border: none; color: var(--gold);
      cursor: pointer; font-size: .8rem; font-weight: 600;
      text-align: center; text-transform: uppercase; letter-spacing: .1em;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    #host-body {
      padding: 16px 20px 28px;
      display: grid; grid-template-columns: 1fr 1fr; gap: 14px;
      max-width: 860px; margin: 0 auto;
    }
    .h-section { background: var(--card); border-radius: 10px; padding: 14px; }
    .h-section h3 { font-size: .65rem; text-transform: uppercase; letter-spacing: .14em; color: var(--gold); margin-bottom: 10px; }
    .h-section.full { grid-column: span 2; }
    .script-body { font-size: .82rem; line-height: 1.7; color: var(--text); }
    .script-body strong { color: var(--gold-l); }
    .script-body em { color: #aaa; font-style: italic; }

    .ctrl-row { display: flex; gap: 8px; margin-bottom: 8px; }
    .hbtn {
      flex: 1; padding: 10px 6px; border: none; border-radius: 8px;
      cursor: pointer; font-size: .82rem; font-weight: 600;
      transition: opacity .15s, transform .1s;
    }
    .hbtn:hover { opacity: .85; } .hbtn:active { transform: scale(.97); }
    .hbtn-gold { background: var(--gold); color: #000; }
    .hbtn-blue { background: var(--blue); color: #fff; }
    .hbtn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }

    .dice-section { display: flex; flex-direction: column; align-items: center; gap: 10px; }
    #dice-faces { display: flex; gap: 8px; min-height: 56px; align-items: center; justify-content: center; }
    .dface {
      width: 52px; height: 52px; background: var(--surface);
      border: 2px solid var(--gold); border-radius: 10px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      font-size: 1.6rem; color: var(--gold); font-weight: 700;
    }
    .dface.rolling { animation: shake .45s ease; }
    @keyframes shake {
      0%,100% { transform: rotate(0); }
      25% { transform: rotate(-18deg) scale(1.1); }
      75% { transform: rotate(18deg) scale(1.1); }
    }

    .hp-ctrls { display: flex; flex-wrap: wrap; gap: 8px; }
    .hp-ctrl {
      display: flex; align-items: center; gap: 6px;
      background: var(--surface); border-radius: 8px; padding: 6px 10px;
    }
    .hp-ctrl-name { font-size: .78rem; color: var(--text); min-width: 48px; }
    .hp-cbtn {
      width: 24px; height: 24px; border: none; border-radius: 4px;
      cursor: pointer; font-weight: 700; font-size: .9rem;
    }
    .hp-plus { background: var(--green); color: #fff; }
    .hp-minus { background: var(--red); color: #fff; }

    /* ── END SCREENS ── */
    .end-screen {
      position: fixed; inset: 0; background: rgba(0,0,0,.92);
      flex-direction: column; align-items: center; justify-content: center;
      z-index: 100; display: none;
    }
    .end-emoji { font-size: 6rem; margin-bottom: 18px; }
    .end-title { font-size: 2.8rem; font-weight: 700; margin-bottom: 10px; }
    .end-sub { font-size: 1rem; color: var(--muted); text-align: center; line-height: 1.7; margin-bottom: 28px; }

    @media (max-width: 580px) {
      .setup-title { font-size: 2rem; }
      .s-emoji { font-size: 3.5rem; }
      .s-title { font-size: 1.5rem; }
      #host-body { grid-template-columns: 1fr; }
      .h-section.full { grid-column: span 1; }
    }
  </style>
</head>
<body>

<!-- ═══════════════════ SETUP ═══════════════════ -->
<div id="setup-screen">
  <div class="setup-title">⚔️ 英語勇者團</div>
  <div class="setup-sub">English Quest Adventure — 開口說英語，一起闖關！</div>

  <div class="setup-card">
    <h2>👥 玩家設定（最多 6 人）</h2>
    <div id="player-list">
      <div class="player-row">
        <span class="player-icon">🧙</span>
        <input type="text" placeholder="玩家 1 姓名">
        <button class="btn-rm" onclick="rmPlayer(this)" title="移除">✕</button>
      </div>
      <div class="player-row">
        <span class="player-icon">⚔️</span>
        <input type="text" placeholder="玩家 2 姓名">
        <button class="btn-rm" onclick="rmPlayer(this)" title="移除">✕</button>
      </div>
    </div>
    <button class="btn-add-player" onclick="addPlayer()">＋ 新增玩家</button>

    <div class="divider"></div>

    <h2>⚡ 難易度</h2>
    <div class="diff-row">
      <button class="diff-btn active" onclick="setDiff(this,'easy')">🌱 簡單<br><small>完整句 = 骰 1 顆</small></button>
      <button class="diff-btn" onclick="setDiff(this,'normal')">⚔️ 普通<br><small>完整句 = 骰 2 顆</small></button>
      <button class="diff-btn" onclick="setDiff(this,'hard')">💀 困難<br><small>必須 5+ 才算成功</small></button>
    </div>

    <button class="btn-start" onclick="startGame()">🗡️ 開始冒險！</button>
  </div>
</div>

<!-- ═══════════════════ GAME ═══════════════════ -->
<div id="game-screen">

  <!-- HP Bar -->
  <div id="hp-bar"></div>

  <!-- Scene dots -->
  <div class="scene-dots" id="scene-dots"></div>

  <!-- Scene area -->
  <div id="scene-area">
    <div class="s-emoji" id="s-emoji">⚔️</div>
    <div class="s-phase" id="s-phase"></div>
    <div class="s-title" id="s-title"></div>
    <div class="s-subtitle" id="s-subtitle"></div>
    <div class="challenge-box">
      <div class="challenge-label">🎯 本關挑戰</div>
      <div class="challenge-text" id="c-text"></div>
      <div class="challenge-format" id="c-fmt"></div>
    </div>
    <div id="dice-display">
      <div class="dice-lbl">骰子結果</div>
      <div class="dice-val" id="d-val">🎲</div>
      <div class="dice-verdict" id="d-verdict"></div>
    </div>
  </div>

  <!-- Host Panel -->
  <div id="host-panel">
    <button id="host-toggle" onclick="toggleHost()">
      <span id="host-icon">▲</span> 主持人控制台（只有主持人看）
    </button>
    <div id="host-body">

      <!-- Script -->
      <div class="h-section full">
        <h3>📜 旁白腳本 &amp; 提示</h3>
        <div class="script-body" id="script-body"></div>
      </div>

      <!-- Scene nav -->
      <div class="h-section">
        <h3>🗺️ 場景切換</h3>
        <div class="ctrl-row">
          <button class="hbtn hbtn-outline" onclick="prevScene()">◀ 上一場景</button>
          <button class="hbtn hbtn-gold" onclick="nextScene()">下一場景 ▶</button>
        </div>
        <div class="ctrl-row">
          <button class="hbtn hbtn-outline" onclick="showVictory()">🏆 勝利</button>
          <button class="hbtn hbtn-outline" onclick="showGameOver()">💀 Game Over</button>
        </div>
      </div>

      <!-- Dice -->
      <div class="h-section">
        <h3>🎲 骰子</h3>
        <div class="dice-section">
          <div class="ctrl-row" style="width:100%">
            <button class="hbtn hbtn-blue" onclick="roll(1)">骰 1 顆</button>
            <button class="hbtn hbtn-gold" onclick="roll(2)">骰 2 顆</button>
          </div>
          <div id="dice-faces"></div>
        </div>
      </div>

      <!-- HP controls -->
      <div class="h-section full">
        <h3>❤️ 血量管理</h3>
        <div class="hp-ctrls" id="hp-ctrls"></div>
      </div>

    </div>
  </div>
</div>

<!-- ═══════════════════ END SCREENS ═══════════════════ -->
<div class="end-screen" id="victory-screen">
  <div class="end-emoji">🏆</div>
  <div class="end-title" style="color:var(--gold)">勝利！Victory!</div>
  <div class="end-sub">
    勇者們成功說服了巨龍，帶著寶藏凱旋而歸！<br>
    <strong style="color:var(--gold-l)">Great job speaking English, heroes!</strong>
  </div>
  <button class="btn-start" style="max-width:240px" onclick="resetGame()">🔄 再玩一次</button>
</div>

<div class="end-screen" id="gameover-screen">
  <div class="end-emoji">💀</div>
  <div class="end-title" style="color:var(--red)">Game Over...</div>
  <div class="end-sub">勇者們倒下了，但下次一定能成功！<br>Don't give up — try again!</div>
  <button class="btn-start" style="max-width:240px" onclick="resetGame()">🔄 再試一次</button>
</div>

<script>
// ── DATA ──────────────────────────────────────────────────────────────────────
const SCENES = [
  {
    id: 'intro',
    phase: '冒險開始',
    bg: 'radial-gradient(ellipse at center, #1a0a3a 0%, #0a0a0f 70%)',
    emoji: '🗡️🛡️',
    title: '勇者集合！',
    subtitle: 'Choose Your Class & Introduce Yourself',
    challenge: 'Introduce yourself and choose your class!<br>說出你的職業和你為何踏上這趟冒險！',
    format: '"My name is ___. I am a [Warrior / Mage / Rogue] and I am here to ___!"',
    script: `
<strong>【開場（用中文說規則）】</strong><br>
歡迎來到英語勇者團！今天的規則超簡單：<br>
➡ 每關你們必須 <em>用英語</em> 完成挑戰才能過關<br>
➡ 說出完整英語句子 → 骰骰子決定成功或失敗<br>
➡ 沉默或用中文 → 直接扣血<br>
➡ 全隊一起闖過三關就勝利！<br><br>

<strong>【職業選擇】</strong><br>
⚔️ <strong>Warrior 勇士</strong>：失敗時有一次重試機會<br>
🧙 <strong>Mage 法師</strong>：可以問主持人一個提示（每局一次）<br>
🗡️ <strong>Rogue 盜賊</strong>：可以跳過一個挑戰（每局一次）<br><br>

<strong>【開場挑戰】</strong><br>
請每位玩家用英語說：<br>
<em>"My name is ___. I am a [職業] and I am here to ___!"</em><br><br>
💡 例：<em>"My name is Amy. I am a Mage and I am here to find the Dragon's treasure!"</em><br><br>
<em>每人都說完後 → 切到第一關</em>
    `
  },
  {
    id: 'level1',
    phase: '第一關',
    bg: 'radial-gradient(ellipse at 50% 80%, #0a2a0d 0%, #0a0a0f 70%)',
    emoji: '👺',
    title: '地精守衛的問題',
    subtitle: 'The Goblin Gate',
    challenge: '"STOP! No one passes without answering my questions!<br>Tell me your NAME and WHY you are here!"',
    format: '"My name is ___ and I am here because ___!"',
    script: `
<strong>【旁白（用英語說，製造氣氛）】</strong><br>
<em>You walk into a dark, mossy cave. The smell of mushrooms fills the air.
Suddenly — BANG! A small green goblin jumps out and blocks your path!</em><br><br>

<strong>【地精台詞（用搞笑語氣說）🎭】</strong><br>
<em>"STOP! Nobody passes the Goblin Gate without answering my questions!
Tell me your name... and WHY you are here!
Or I will eat you for dinner! MWAHAHA!"</em><br><br>

<strong>【骰子規則】</strong><br>
✅ 說出<strong>完整句子</strong>（名字 ＋ 原因）→ 骰 2 顆，取高分<br>
⚠️ 只說名字或只說原因 → 骰 1 顆<br>
❌ 沉默 / 說中文 → 直接失敗，-1 ❤️<br>
🎯 骰出 4-6 = 成功 ／ 1-3 = 地精攻擊 -1 ❤️<br><br>

<strong>【成功】</strong><br>
<em>"Hmm... I like your answer! You may pass... this time! 😤👌"</em><br><br>

<strong>【失敗】</strong><br>
<em>"Wrong answer! Take that! 💥"（扣血，但可再試）</em><br><br>

<strong>【選用：謎語加分關】</strong><br>
❓ <em>"I have a head and a tail, but no body. What am I?"</em><br>
💡 答案：<strong>A coin（硬幣）</strong>— 答對恢復 1 ❤️
    `
  },
  {
    id: 'level2',
    phase: '第二關',
    bg: 'radial-gradient(ellipse at 50% 30%, #2a0d4a 0%, #0a0a0f 70%)',
    emoji: '🦁📚',
    title: '獅身人面獸的謎題',
    subtitle: "The Sphinx's Riddle",
    challenge: '"Solve my riddle or face my wrath!<br>I have cities but no houses, mountains but no trees, water but no fish. What am I?"',
    format: '"I think the answer is ___ because ___."',
    script: `
<strong>【旁白】</strong><br>
<em>You push open a heavy stone door and enter a grand magical library.
Ancient books float through the air.
In the center sits an enormous Sphinx — half lion, half human.
It slowly opens one golden eye...</em><br><br>

<strong>【獅身人面獸台詞 🎭】</strong><br>
<em>"Hmm. Brave little humans. I will let you pass — but ONLY if you solve my riddle.
Ready? Listen carefully..."</em><br><br>

<em>"I have cities... but no houses live there.<br>
I have mountains... but no trees grow there.<br>
I have water... but no fish swim there.<br>
I have roads... but no cars drive there.<br>
What... am... I?"</em><br><br>

<strong>【規則】</strong><br>
1. 給玩家 30 秒用英語互相討論<br>
2. 任一玩家說出答案並給理由：<em>"I think the answer is ___ because ___."</em><br>
3. 答錯 → 給一個提示，免費再試一次<br><br>

💡 <strong>答案：A map（地圖）</strong><br>
答對 → 獅身人面獸開門，全隊恢復 1 ❤️<br><br>

<strong>【成功台詞】</strong><br>
<em>"Correct! You are wiser than you look. The door is open. Go!"</em>
    `
  },
  {
    id: 'level3',
    phase: '最終關卡',
    bg: 'radial-gradient(ellipse at 50% 80%, #3a0a0a 0%, #0a0a0f 70%)',
    emoji: '🐉',
    title: '巨龍的考驗',
    subtitle: "The Dragon's Challenge — Boss Fight!",
    challenge: '"Tell me ONE thing you LOVE and ONE thing you FEAR.<br>ALL of you. In English. Or I\'ll eat you for dinner!"',
    format: '"I love ___ because ___. I am afraid of ___ because ___."',
    script: `
<strong>【旁白】</strong><br>
<em>The tunnel opens into a MASSIVE cavern.
Mountains of gold coins surround you.
And in the center — a RED DRAGON the size of a building.
It opens one enormous eye. You can feel its hot breath on your face...</em><br><br>

<strong>【龍的台詞 🐉🎭】</strong><br>
<em>"Humans... I smell your fear.
I have eaten ONE THOUSAND heroes.
But today... I am BORED.
Entertain me! Tell me something TRUE.
One thing you LOVE. One thing you FEAR.
ALL of you must speak.
...Or I will have you for dinner.
Your. Choice."</em><br><br>

<strong>【規則 — Boss HP 系統】</strong><br>
🐉 龍的 HP = 玩家人數<br>
✅ 每位玩家說出完整的 love ＋ fear → 龍 -1 HP<br>
❌ 沒說出來 → 龍噴火，玩家 -2 ❤️<br>
🎲 可選用骰子：4-6 = 龍特別欣賞你，給全隊 +1 ❤️<br><br>

<strong>【所有玩家都說完 → 勝利！】</strong><br>
<em>"...Interesting. You humans are strange creatures.
But I respect your honesty!
Take ONE piece of treasure and leave.
And remember — a dragon NEVER forgets a good story."</em><br><br>

<em>👉 按右下角「勝利」按鈕觸發結局畫面！</em>
    `
  }
];

const ICONS = ['🧙','⚔️','🗡️','🏹','🛡️','🔮'];
const DICE_FACES = ['⚀','⚁','⚂','⚃','⚄','⚅'];

let players = [];
let scene = 0;
let hostOpen = true;

// ── SETUP ────────────────────────────────────────────────────────────────────
function addPlayer() {
  const list = document.getElementById('player-list');
  const rows = list.querySelectorAll('.player-row');
  if (rows.length >= 6) return;
  const i = rows.length;
  const row = document.createElement('div');
  row.className = 'player-row';
  row.innerHTML = `
    <span class="player-icon">${ICONS[i] || '🧑'}</span>
    <input type="text" placeholder="玩家 ${i + 1} 姓名">
    <button class="btn-rm" onclick="rmPlayer(this)">✕</button>`;
  list.appendChild(row);
}

function rmPlayer(btn) {
  const list = document.getElementById('player-list');
  if (list.querySelectorAll('.player-row').length <= 1) return;
  btn.closest('.player-row').remove();
}

function setDiff(btn, d) {
  document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}

function startGame() {
  const inputs = document.querySelectorAll('#player-list input');
  players = Array.from(inputs).map((inp, i) => ({
    name: inp.value.trim() || `玩家 ${i + 1}`,
    hp: 3, maxHp: 3, icon: ICONS[i] || '🧑'
  }));
  document.getElementById('setup-screen').style.display = 'none';
  document.getElementById('game-screen').style.display = 'flex';
  buildHpBar(); buildHpCtrls(); buildDots(); renderScene(0);
}

// ── HP ───────────────────────────────────────────────────────────────────────
function buildHpBar() {
  document.getElementById('hp-bar').innerHTML = players.map((p, i) => `
    <div class="p-hp">
      <div class="p-hp-name">${p.icon} ${p.name}</div>
      <div class="p-hp-hearts" id="h${i}"></div>
    </div>`).join('');
  renderHp();
}

function renderHp() {
  players.forEach((p, i) => {
    const el = document.getElementById(`h${i}`);
    if (!el) return;
    el.innerHTML = Array.from({length: p.maxHp}, (_, h) =>
      `<span>${h < p.hp ? '❤️' : '🖤'}</span>`).join('');
  });
  if (players.every(p => p.hp === 0)) showGameOver();
}

function changeHp(i, d) {
  players[i].hp = Math.max(0, Math.min(players[i].maxHp, players[i].hp + d));
  renderHp();
}

function buildHpCtrls() {
  document.getElementById('hp-ctrls').innerHTML = players.map((p, i) => `
    <div class="hp-ctrl">
      <span class="hp-ctrl-name">${p.icon} ${p.name}</span>
      <button class="hp-cbtn hp-minus" onclick="changeHp(${i},-1)">−</button>
      <button class="hp-cbtn hp-plus"  onclick="changeHp(${i},+1)">+</button>
    </div>`).join('');
}

// ── SCENES ───────────────────────────────────────────────────────────────────
function buildDots() {
  document.getElementById('scene-dots').innerHTML =
    SCENES.map((_, i) => `<div class="dot" id="dot${i}"></div>`).join('');
}

function renderScene(idx) {
  scene = idx;
  const s = SCENES[idx];
  document.getElementById('scene-area').style.background = s.bg;
  document.getElementById('s-emoji').textContent = s.emoji;
  document.getElementById('s-phase').textContent = s.phase;
  document.getElementById('s-title').textContent = s.title;
  document.getElementById('s-subtitle').textContent = s.subtitle;
  document.getElementById('c-text').innerHTML = s.challenge;
  document.getElementById('c-fmt').innerHTML = s.format;
  document.getElementById('script-body').innerHTML = s.script;
  document.getElementById('dice-display').style.display = 'none';
  document.getElementById('dice-faces').innerHTML = '';
  SCENES.forEach((_, i) => {
    const d = document.getElementById(`dot${i}`);
    if (!d) return;
    d.className = 'dot' + (i === idx ? ' active' : i < idx ? ' done' : '');
  });
}

function nextScene() { if (scene < SCENES.length - 1) renderScene(scene + 1); }
function prevScene() { if (scene > 0) renderScene(scene - 1); }

// ── DICE ─────────────────────────────────────────────────────────────────────
function roll(count) {
  const facesEl = document.getElementById('dice-faces');
  const results = Array.from({length: count}, () => Math.ceil(Math.random() * 6));
  const best = Math.max(...results);

  facesEl.innerHTML = results.map(() => `<div class="dface rolling">🎲</div>`).join('');

  setTimeout(() => {
    facesEl.innerHTML = results.map(r => `
      <div class="dface">${DICE_FACES[r - 1]}<br>
      <small style="font-size:.5rem;color:var(--muted)">${r}</small></div>`).join('');

    const ok = best >= 4;
    const dd = document.getElementById('dice-display');
    dd.style.display = 'block';
    document.getElementById('d-val').textContent = DICE_FACES[best - 1];
    const vd = document.getElementById('d-verdict');
    vd.textContent = ok ? `${best} — 成功！✅` : `${best} — 失敗... ❌`;
    vd.className = `dice-verdict ${ok ? 'ok' : 'ng'}`;
  }, 480);
}

// ── HOST PANEL ───────────────────────────────────────────────────────────────
function toggleHost() {
  hostOpen = !hostOpen;
  document.getElementById('host-body').style.display = hostOpen ? 'grid' : 'none';
  document.getElementById('host-icon').textContent = hostOpen ? '▲' : '▼';
}

// ── END ──────────────────────────────────────────────────────────────────────
function showVictory() { document.getElementById('victory-screen').style.display = 'flex'; }
function showGameOver() { document.getElementById('gameover-screen').style.display = 'flex'; }

function resetGame() {
  ['victory-screen','gameover-screen'].forEach(id =>
    document.getElementById(id).style.display = 'none');
  document.getElementById('game-screen').style.display = 'none';
  document.getElementById('setup-screen').style.display = 'flex';
}
</script>
</body>
</html>
